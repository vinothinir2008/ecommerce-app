<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container">
  <div class="card">
    <h2>Add Product</h2>
    <input id="name" placeholder="Name">
    <input id="price" type="number" placeholder="Price">
    <input id="image" placeholder="Image URL (optional)">
    <textarea id="description" placeholder="Description"></textarea>
    <input id="stock" type="number" placeholder="Stock" value="10">
    <button onclick="add()">Add Product</button>
  </div>
  <h2>All Products</h2>
  <div class="grid" id="list"></div>
</div>
<script src="common.js"></script>
<script>
if (role() !== 'admin') location.href = 'login.html';
navbar();
async function load() {
  const all = await api('/products');
  document.getElementById('list').innerHTML = all.map(p => `
    <div class="card product">
      ${p.image ? `<img src="${p.image}">` : ''}
      <h3>${p.name}</h3>
      <p class="price">₹${p.price}</p>
      <button class="red" onclick="del('${p._id}')">Delete</button>
    </div>`).join('');
}
async function add() {
  try {
    await api('/products', 'POST', {
      name: document.getElementById('name').value,
      price: Number(document.getElementById('price').value),
      image: document.getElementById('image').value,
      description: document.getElementById('description').value,
      stock: Number(document.getElementById('stock').value)
    });
    ['name', 'price', 'image', 'description'].forEach(i => document.getElementById(i).value = '');
    load();
  } catch (e) { alert(e.message); }
}
async function del(id) {
  if (!confirm('Delete?')) return;
  await api('/products/' + id, 'DELETE');
  load();
}
load();
</script>
</body>
</html>
